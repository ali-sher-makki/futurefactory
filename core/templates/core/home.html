<div class="ff-tilt-grid">
    {% for service in services %}
    <a href="{{ service.get_absolute_url }}" class="ff-tilt-card">
        {% if service.icon %}<span class="ff-card-icon">{{ service.icon }}</span>{% endif %}
        <h3>{{ service.name }}</h3>
        <p>{{ service.short_description }}</p>
    </a>
    {% endfor %}
</div>
<div class="ff-view-all">
    <a href="{% url 'services:list' %}" class="ff-btn-secondary">View all services</a>
</div>

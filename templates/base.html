{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Future Factory{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="ff-navbar">
        <a href="{% url 'core:home' %}" class="ff-logo">Future<span>Factory</span></a>
        <button class="ff-nav-toggle" id="ff-nav-toggle" aria-label="Toggle navigation">
            <span class="ff-hamburger-line"></span>
            <span class="ff-hamburger-line"></span>
            <span class="ff-hamburger-line"></span>
        </button>
        <nav class="ff-nav-menu" id="ff-nav-menu">
            <a href="{% url 'core:home' %}">Home</a>
            <a href="{% url 'services:list' %}">Services</a>
            <a href="{% url 'core:about' %}">About</a>
            <a href="{% url 'core:contact' %}">Contact</a>
            <a href="{% url 'core:about' %}">Leadership</a>
        </nav>
        <div class="ff-nav-overlay" id="ff-nav-overlay"></div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="ff-footer">
        <p>&copy; {% now "Y" %} Future Factory. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('ff-nav-toggle');
            const menu = document.getElementById('ff-nav-menu');
            const overlay = document.getElementById('ff-nav-overlay');

            if (toggle && menu && overlay) {
                function toggleMenu() {
                    toggle.classList.toggle('active');
                    menu.classList.toggle('open');
                    overlay.classList.toggle('active');
                    document.body.classList.toggle('nav-open');
                }

                function closeMenu() {
                    toggle.classList.remove('active');
                    menu.classList.remove('open');
                    overlay.classList.remove('active');
                    document.body.classList.remove('nav-open');
                }

                toggle.addEventListener('click', toggleMenu);
                overlay.addEventListener('click', closeMenu);

                menu.querySelectorAll('a').forEach(function(link) {
                    link.addEventListener('click', closeMenu);
                });
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
